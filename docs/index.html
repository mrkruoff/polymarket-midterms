<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polymarket 2026 Midterms Tracker</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
    --c-dem: #2a78d6; --c-rep: #e34948;
    --c-n1: #008300; --c-n2: #4a3aa7; --c-n3: #eda100; --c-n4: #1baf7a;
    --spark: #c3c2b7; --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
      --c-dem: #3987e5; --c-rep: #e66767;
      --c-n1: #008300; --c-n2: #9085e9; --c-n3: #c98500; --c-n4: #199e70;
      --spark: #52514e; --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --c-dem: #3987e5; --c-rep: #e66767;
    --c-n1: #008300; --c-n2: #9085e9; --c-n3: #c98500; --c-n4: #199e70;
    --spark: #52514e; --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1160px; margin: 0 auto; padding: 0 16px 48px; }
  header {
    max-width: 1160px; margin: 0 auto; padding: 20px 16px 4px;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  h1 { font-size: 19px; margin: 0; }
  .sub { color: var(--ink-2); margin: 2px 0 0; font-size: 13px; }
  .hdr-right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  #countdown { font-weight: 600; }
  #themeBtn {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px;
  }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .tile .lbl { color: var(--ink-2); font-size: 12px; }
  .tile .val { font-size: 26px; font-weight: 600; margin-top: 2px; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 4px 0 12px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: none; color: var(--ink-2); padding: 5px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .filters input[type=search], .filters select {
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    border-radius: 8px; padding: 5px 9px; font: inherit; font-size: 13px;
  }
  .filters input[type=search] { min-width: 200px; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  .layout { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 14px; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .detailcard { position: static; } }
  .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; max-height: 76vh; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  thead th {
    position: sticky; top: 0; background: var(--surface); text-align: left; color: var(--ink-2);
    font-weight: 500; font-size: 12px; padding: 8px 10px; border-bottom: 1px solid var(--grid); z-index: 1;
  }
  tbody td { padding: 6px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
  tbody tr[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .fav { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .key { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .racetitle { font-weight: 500; }
  .rtype { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  .detailcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; position: sticky; top: 12px; }
  .detailcard h2 { font-size: 15px; margin: 0 0 2px; }
  .detailmeta { color: var(--ink-2); font-size: 12px; margin-bottom: 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin: 6px 0 2px; }
  .legend .item { display: inline-flex; align-items: center; gap: 6px; }
  .legend .lk { width: 14px; height: 0; border-top: 2px solid; border-radius: 2px; }
  .chartbox { position: relative; }
  .chartbox svg { display: block; width: 100%; height: auto; }
  .tooltip {
    position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12);
    display: none; min-width: 130px; z-index: 2;
  }
  .tooltip .tdate { color: var(--muted); margin-bottom: 3px; }
  .tooltip .trow { display: flex; align-items: center; gap: 6px; }
  .tooltip .tval { font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }
  .tooltip .tname { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
  .minitable { width: 100%; margin-top: 8px; font-size: 12px; }
  .minitable td { padding: 3px 6px; border-bottom: 1px solid var(--grid); }
  .resultscard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-top: 16px; }
  .resultscard h2 { font-size: 15px; margin: 0 0 6px; }
  .pending { color: var(--muted); }
  footer { color: var(--muted); font-size: 12px; margin-top: 18px; }
  .axislabel { fill: var(--muted); font-size: 10px; }
  .endlabel { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Polymarket 2026 Midterms Tracker</h1>
    <p class="sub">Daily snapshot of every Senate, House and governor race market &middot; election day Nov 3, 2026</p>
  </div>
  <div class="hdr-right">
    <span id="countdown"></span>
    <button id="themeBtn" aria-label="Toggle color theme">theme</button>
  </div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="filters">
    <span class="seg" id="typeSeg" role="group" aria-label="Race type">
      <button data-type="" aria-pressed="true">All</button>
      <button data-type="senate" aria-pressed="false">Senate</button>
      <button data-type="governor" aria-pressed="false">Governor</button>
      <button data-type="house" aria-pressed="false">House</button>
    </span>
    <input id="search" type="search" placeholder="Search races or candidates&hellip;" aria-label="Search races">
    <select id="sort" aria-label="Sort races">
      <option value="volume">Sort: volume</option>
      <option value="close">Sort: most competitive</option>
      <option value="title">Sort: A&ndash;Z</option>
    </select>
    <span class="count" id="count"></span>
  </section>
  <section class="layout">
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th>Race</th><th>Favorite</th><th class="num">Price</th><th class="num">Volume</th><th>Trend</th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="detailcard" id="detail"></div>
  </section>
  <section class="resultscard" id="results"></section>
  <footer id="foot"></footer>
</main>
<script>
"use strict";
if (location.hash === "#dark" || location.hash === "#light")
  document.documentElement.dataset.theme = location.hash.slice(1);
const $ = (s) => document.querySelector(s);
const NEUTRALS = ["var(--c-n1)", "var(--c-n2)", "var(--c-n3)", "var(--c-n4)"];
const fmtPct = (p) => p == null ? "–" : (p * 100).toFixed(p >= 0.995 || p < 0.01 ? 1 : 0) + "%";
const fmtVol = (v) => v >= 1e6 ? "$" + (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + Math.round(v);
const el = (tag, attrs = {}, ...kids) => {
  const ns = ["svg","path","line","circle","g","text","rect"].includes(tag);
  const n = ns ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const k of kids) n.append(k);
  return n;
};

// party from candidate name; null -> neutral slot (never blue/red, so partisan
// color can't mislead when the party is unknown)
function party(name) {
  if (/\(D\)|Democrat/i.test(name)) return "D";
  if (/\(R\)|Republican/i.test(name)) return "R";
  return null;
}
function colorsFor(cands) {
  // color follows the entity: party colors where known, otherwise neutral slots
  // assigned in alphabetical order so they never repaint on re-sort
  const colors = new Map();
  const unknown = cands.filter(c => !party(c.name)).map(c => c.name).sort();
  for (const c of cands) {
    const p = party(c.name);
    colors.set(c.name, p === "D" ? "var(--c-dem)" : p === "R" ? "var(--c-rep)" :
      NEUTRALS[unknown.indexOf(c.name) % NEUTRALS.length]);
  }
  return colors;
}
const favorite = (race) => race.candidates[0];

let DATA, state = { type: "", q: "", sort: "volume", sel: null };

fetch("data.json").then(r => r.json()).then(d => { DATA = d; init(); })
  .catch(e => { $("#detail").textContent = "Failed to load data.json — serve this folder over HTTP."; });

function init() {
  const days = Math.ceil((new Date(DATA.election_day) - new Date(DATA.generated_at)) / 864e5);
  $("#countdown").textContent = days > 0 ? `${days} day${days === 1 ? "" : "s"} to election` :
    days === 0 ? "Election day" : "post-election";
  $("#foot").textContent = `Data: Polymarket public Gamma/CLOB APIs · generated ${DATA.generated_at.slice(0, 16).replace("T", " ")} UTC · prices are market odds, not forecasts`;
  renderKpis(); renderResults();
  $("#typeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    state.type = b.dataset.type;
    for (const x of $("#typeSeg").children) x.setAttribute("aria-pressed", x === b);
    renderTable();
  });
  $("#search").addEventListener("input", (e) => { state.q = e.target.value.toLowerCase(); renderTable(); });
  $("#sort").addEventListener("change", (e) => { state.sort = e.target.value; renderTable(); });
  $("#themeBtn").addEventListener("click", () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  });
  state.sel = DATA.races[0].id;
  renderTable();
}

function renderKpis() {
  const races = DATA.races;
  const favs = races.map(r => favorite(r).price).filter(p => p != null);
  const over95 = favs.filter(p => p >= 0.95).length, comp = favs.filter(p => p < 0.8).length;
  const tiles = [
    ["Races tracked", String(races.length)],
    ["Favorites priced ≥95%", Math.round(100 * over95 / favs.length) + "%"],
    ["Competitive (fav <80%)", String(comp)],
    ["Total volume", fmtVol(races.reduce((s, r) => s + r.volume, 0))],
  ];
  $("#kpis").replaceChildren(...tiles.map(([l, v]) =>
    el("div", { class: "tile" }, el("div", { class: "lbl" }, l), el("div", { class: "val" }, v))));
}

function filtered() {
  let rs = DATA.races.filter(r => !state.type || r.type === state.type);
  if (state.q) rs = rs.filter(r => r.title.toLowerCase().includes(state.q) ||
    r.candidates.some(c => c.name.toLowerCase().includes(state.q)));
  const key = { volume: r => -r.volume, close: r => Math.abs((favorite(r).price ?? 1) - 0.5), title: r => null }[state.sort];
  if (state.sort === "title") rs.sort((a, b) => a.title.localeCompare(b.title));
  else rs.sort((a, b) => key(a) - key(b));
  return rs;
}

function sparkline(race) {
  // favorite's last-30-day path; de-emphasis hue, end dot
  const n = DATA.dates.length, lo = Math.max(0, n - 30);
  const fav = favorite(race);
  const pts = [];
  for (let i = lo; i < n; i++) if (fav.series[i] != null) pts.push([i - lo, fav.series[i]]);
  if (pts.length < 2) return el("svg", { width: 90, height: 24 });
  const X = (i) => 2 + i / (n - 1 - lo) * 86, Y = (p) => 21 - p * 18;
  const dStr = pts.map((p, i) => (i ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return el("svg", { width: 90, height: 24, viewBox: "0 0 90 24", "aria-hidden": "true" },
    el("path", { d: dStr, fill: "none", "stroke-width": 1.5, style: "stroke:var(--spark)" }),
    el("circle", { cx: X(last[0]), cy: Y(last[1]), r: 2.5, style: "fill:var(--ink-2)" }));
}

function renderTable() {
  const rs = filtered();
  $("#count").textContent = rs.length + " races";
  if (!rs.some(r => r.id === state.sel) && rs.length) state.sel = rs[0].id;
  const body = $("#rows");
  body.replaceChildren(...rs.map(r => {
    const fav = favorite(r), colors = colorsFor(r.candidates);
    const tr = el("tr", { "aria-selected": String(r.id === state.sel), tabindex: 0,
      onclick: () => select(r.id), onkeydown: (e) => { if (e.key === "Enter") select(r.id); } },
      el("td", {}, el("div", { class: "racetitle" }, r.title), el("div", { class: "rtype" }, r.type)),
      el("td", {}, el("span", { class: "fav" },
        el("span", { class: "key", style: "background:" + colors.get(fav.name) }), fav.name)),
      el("td", { class: "num" }, fmtPct(fav.price)),
      el("td", { class: "num" }, fmtVol(r.volume)),
      el("td", {}, sparkline(r)));
    return tr;
  }));
  renderDetail();
}

function select(id) { state.sel = id; renderTable(); $("#detail").scrollIntoView({ block: "nearest" }); }

function renderDetail() {
  const race = DATA.races.find(r => r.id === state.sel);
  const card = $("#detail");
  if (!race) { card.textContent = "Select a race."; return; }
  const colors = colorsFor(race.candidates);
  card.replaceChildren(
    el("h2", {}, race.title),
    el("div", { class: "detailmeta" },
      `${race.type} · ${race.n_candidates} markets · ${fmtVol(race.volume)} total volume`),
    lineChart(race, colors),
    el("div", { class: "legend" }, ...race.candidates.map(c =>
      el("span", { class: "item" }, el("span", { class: "lk", style: "border-color:" + colors.get(c.name) }), c.name))),
    el("table", { class: "minitable" }, el("tbody", {}, ...race.candidates.map(c =>
      el("tr", {},
        el("td", {}, el("span", { class: "fav" }, el("span", { class: "key", style: "background:" + colors.get(c.name) }), c.name)),
        el("td", { class: "num" }, fmtPct(c.price)),
        el("td", { class: "num" }, fmtVol(c.volume)))))));
}

function lineChart(race, colors) {
  const W = 480, H = 240, M = { t: 10, r: 46, b: 22, l: 34 };
  const dates = DATA.dates, n = dates.length;
  const X = (i) => M.l + i / (n - 1) * (W - M.l - M.r);
  const Y = (p) => M.t + (1 - p) * (H - M.t - M.b);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": "Price history, " + race.title });
  for (const v of [0, .25, .5, .75, 1])
    svg.append(
      el("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), "stroke-width": 1, style: "stroke:var(--grid)" }),
      el("text", { x: M.l - 5, y: Y(v) + 3, "text-anchor": "end", class: "axislabel" }, v * 100 + "%"));
  const tickIdx = [0, Math.floor(n / 2), n - 1];
  for (const i of tickIdx)
    svg.append(el("text", { x: X(i), y: H - 6, "text-anchor": i === 0 ? "start" : i === n - 1 ? "end" : "middle", class: "axislabel" },
      dates[i].slice(5).replace("-", "/")));
  for (const c of race.candidates) {
    let d = "", pen = false;
    c.series.forEach((v, i) => {
      if (v == null) { pen = false; return; }
      d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true;
    });
    svg.append(el("path", { d, fill: "none", "stroke-width": 2, "stroke-linejoin": "round",
      "stroke-linecap": "round", style: "stroke:" + colors.get(c.name) }));
    const li = c.series.reduce((a, v, i) => v != null ? i : a, -1);
    if (li >= 0) svg.append(el("circle", { cx: X(li), cy: Y(c.series[li]), r: 4,
      "stroke-width": 2, style: "fill:" + colors.get(c.name) + ";stroke:var(--surface)" }));
  }
  // direct end labels where they don't collide; legend carries the rest
  const ends = race.candidates
    .map(c => ({ c, li: c.series.reduce((a, v, i) => v != null ? i : a, -1) }))
    .filter(e => e.li >= 0).map(e => ({ ...e, y: Y(e.c.series[e.li]) }))
    .sort((a, b) => a.y - b.y);
  let lastY = -99;
  for (const e of ends) {
    if (e.y - lastY < 14) continue;
    lastY = e.y;
    svg.append(el("text", { x: W - M.r + 8, y: e.y + 4, class: "endlabel" }, fmtPct(e.c.series[e.li])));
  }
  // crosshair + tooltip (one tooltip, every series; hit target = whole plot)
  const cross = el("line", { y1: M.t, y2: H - M.b, "stroke-width": 1, style: "stroke:var(--axis);display:none" });
  svg.append(cross);
  const tip = el("div", { class: "tooltip" });
  const box = el("div", { class: "chartbox" }, svg, tip);
  const show = (clientX) => {
    const r = svg.getBoundingClientRect();
    const fx = (clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n - 1, Math.round((fx - M.l) / (W - M.l - M.r) * (n - 1))));
    cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.style.display = "";
    tip.replaceChildren(el("div", { class: "tdate" }, dates[i]),
      ...race.candidates.filter(c => c.series[i] != null).map(c =>
        el("div", { class: "trow" },
          el("span", { class: "lk legend-lk", style: "width:12px;border-top:2px solid " + colors.get(c.name) + ";display:inline-block" }),
          el("span", { class: "tname" }, c.name),
          el("span", { class: "tval" }, fmtPct(c.series[i])))));
    tip.style.display = "block";
    const px = X(i) / W * r.width;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + "px";
    tip.style.top = "8px";
  };
  svg.addEventListener("pointermove", (e) => show(e.clientX));
  svg.addEventListener("pointerleave", () => { cross.style.display = "none"; tip.style.display = "none"; });
  return box;
}

function renderResults() {
  const card = $("#results"), res = DATA.results;
  card.replaceChildren(el("h2", {}, "Scorecard"));
  if (!res) {
    card.append(el("p", { class: "pending" },
      "Appears after election day: hit rate and Brier score at every days-out horizon, plus calibration. The daily job keeps collecting until then."));
    return;
  }
  card.append(el("p", {}, `${res.n_resolved} of ${res.n_races_total} races resolved.`));
  const t = el("table", { class: "minitable" },
    el("thead", {}, el("tr", {}, ...["Days out", "Date", "Races", "Hit rate", "Brier"].map(h => el("th", {}, h)))),
    el("tbody", {}, ...Object.entries(res.by_days_out).map(([d, r]) =>
      el("tr", {}, el("td", { class: "num" }, d), el("td", {}, r.date), el("td", { class: "num" }, String(r.n_races)),
        el("td", { class: "num" }, (r.hit_rate * 100).toFixed(1) + "%"), el("td", { class: "num" }, r.brier.toFixed(3))))));
  card.append(t);
  if (res.calibration && res.calibration.length) {
    card.append(el("h2", { style: "margin-top:12px" }, `Calibration at ${res.calibration_days_out} days out`),
      el("table", { class: "minitable" },
        el("thead", {}, el("tr", {}, ...["Priced", "N", "Mean price", "Won"].map(h => el("th", {}, h)))),
        el("tbody", {}, ...res.calibration.map(c =>
          el("tr", {}, el("td", {}, c.bucket), el("td", { class: "num" }, String(c.n)),
            el("td", { class: "num" }, (c.mean_price * 100).toFixed(0) + "%"),
            el("td", { class: "num" }, (c.win_rate * 100).toFixed(1) + "%"))))));
  }
}
</script>
</body>
</html>
